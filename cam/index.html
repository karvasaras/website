<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Καρβασαράς Καρδίτσας | Live Camera</title>
    <meta name="description" content="Δείτε ζωντανά την κάμερα του Καρβασαρά Καρδίτσας.">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Καρβασαράς Καρδίτσας - Live Camera">
    <meta property="og:url" content="https://karvasaras-karditsas.gr/cam">
    <meta property="og:site_name" content="Καρβασαράς Καρδίτσας">
    <meta property="og:image" content="https://karvasaras-karditsas.gr/cam/karvasaras.jpg">
    <meta property="og:type" content="website">
    <link rel="canonical" href="https://karvasaras-karditsas.gr/cam">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style> 
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #213a23;
            margin: 0;
            color: white;
            font-family: 'Poppins', sans-serif;
            flex-direction: column;
            position: relative;
            text-align: center;
        }
        .logo {
            width: 350px;
            height: 350px;
            background: url('karvasaras_logo.png') no-repeat center;
            background-size: contain;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .hidden {
            display: none;
        }
        .content {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
        }
        .top-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0px;
            margin-top: auto;
        }
        .top-content .logo {
            width: 200px;
            height: 100px;
            animation: none;
        }
        .top-content .hashtag {
            font-size: 20px;
            color: white;
            text-decoration: none;
        }
        .top-content .hashtag a {
            color: white;
            text-decoration: none;
        }
        .top-content .hashtag a:hover {
            color: white;
            font-weight: bold;
            text-decoration: none;
        }
	.container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: fit-content;
            max-width: 100%;
            margin: 0 auto;
            border: 4px solid #1b2e1b;
            border-radius: 10px;
            overflow: hidden;
        }
        .container img {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .container img.active {
            opacity: 1;
        }
        @keyframes fade {
            0% { opacity: 0; }
            10% { opacity: 1; }
            30% { opacity: 1; }
            40% { opacity: 0; }
            100% { opacity: 0; }
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }
	.text {
	    font-size: 14px;
            margin-top: 20px;
            position: relative;
            text-align: center;
        }
	.text a, a:hover, a:visited {
	   color: white;
	   text-decoration: underline;
	}
        .info-box {
            background-color: #1a2f1c;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 5px;
            margin-top: 10px;
        }
        @media screen and (max-width: 768px) {
            .slideshow {
                height: 45vh;
            }
            .logo {
                width: 210px;
                height: 210px;
            }
            .top-content {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 0px;
                /* margin-top: 0px; */
            }
            .top-content .logo {
                width: 150px;
                height: 75px;
                animation: none;
            }
            .top-content .hashtag {
                font-size: 16px;
            }
            .text h2 {
                font-size: 1.2em;
            }
            .text p {
                font-size: 1em;
            }
            .social-buttons a {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
        }
    </style>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const image = document.querySelector('.container img');
        const modalImg = document.getElementById('modal-img');
        const modal = document.getElementById('modal');

        function updateImage() {
            const timestamp = Date.now();
            image.src = "/cam/karvasaras.jpg?" + timestamp;
            if (modal.style.display === "flex") {
                modalImg.src = "/cam/karvasaras_clean.jpg?" + timestamp;
            }
        }

        setInterval(updateImage, 15000);

        setTimeout(() => {
            document.querySelector(".logo").classList.add("hidden");
            document.querySelector(".content").classList.remove("hidden");
        }, 1000);

        image.addEventListener("click", function() {
            modal.style.display = 'flex';
            modalImg.src = "/cam/karvasaras_clean.jpg?" + Date.now();
        });

        modal.addEventListener("click", function() {
            modal.style.display = 'none';
        });
    });
    </script>
</head>
<body>
    <div class="logo"></div>
    <div class="content hidden">
        <div class="top-content">
            <div class="logo"></div>
        </div>
        <div class="container">
            <img class="active" src="/cam/karvasaras.jpg" title="Karvasaras Village" alt="Karvasaras Cam" onclick="openModal()">
        </div>
        <div id="modal" class="modal" onclick="closeModal()">
            <img id="modal-img" class="modal-content">
        </div>
	<div class="text">
	    <p>Η εικόνα ανανεώνεται αυτόματα.</p>
	    <p>Κάντε click πάνω στην εικόνα για μεγέθυνση.</p>
    </div>
</body>
</html>
